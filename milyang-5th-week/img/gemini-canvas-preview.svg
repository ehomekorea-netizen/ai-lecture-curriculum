<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#1E1F2B"/>
  
  <!-- Left Side: Chat & Prompting (40%) -->
  <rect x="0" y="0" width="320" height="500" fill="#181924" border-right="1px solid #2B2C3E"/>
  <rect x="15" y="15" width="290" height="40" rx="8" fill="#242636"/>
  <text x="30" y="40" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#8CA4FF">✨ Gemini Canvas</text>

  <!-- User Prompt Chat Bubble -->
  <g transform="translate(15, 75)">
    <rect width="290" height="85" rx="10" fill="#2B3048"/>
    <text x="14" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#72F3C0">👤 User (Vibe Prompt)</text>
    <text x="14" y="44" font-family="-apple-system, sans-serif" font-size="10" fill="#E2E6F8">"모던 다크 테마의 1페이지 인터랙티브</text>
    <text x="14" y="60" font-family="-apple-system, sans-serif" font-size="10" fill="#E2E6F8">포트폴리오 만들어줘. Hero 타이핑 애니와</text>
    <text x="14" y="76" font-family="-apple-system, sans-serif" font-size="10" fill="#E2E6F8">카드 호버 효과 포함해줘!"</text>
  </g>

  <!-- Gemini AI Response -->
  <g transform="translate(15, 175)">
    <rect width="290" height="90" rx="10" fill="#222434"/>
    <text x="14" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#8CA4FF">✨ Gemini Assistant</text>
    <text x="14" y="44" font-family="-apple-system, sans-serif" font-size="10" fill="#A8ADC8">"우측 캔버스에 단일 HTML 코드를 생성했습니다.</text>
    <text x="14" y="60" font-family="-apple-system, sans-serif" font-size="10" fill="#A8ADC8">CSS 애니메이션과 반응형 레이아웃이 적용되었으며,</text>
    <text x="14" y="76" font-family="-apple-system, sans-serif" font-size="10" fill="#53DFA9">실시간으로 브라우저 프리뷰를 확인하세요!"</text>
  </g>

  <!-- Left Bottom Download Button -->
  <g transform="translate(15, 435)">
    <rect width="290" height="42" rx="8" fill="#476BFF"/>
    <text x="145" y="26" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">📥 index.html 파일 다운로드</text>
  </g>

  <!-- Right Side: Real-time Live Web Preview Canvas (60%) -->
  <g transform="translate(330, 15)">
    <rect width="455" height="470" rx="12" fill="#0D0E15" stroke="#2B2C3E" stroke-width="1.5"/>
    <rect width="455" height="34" rx="12 12 0 0" fill="#181924"/>
    <circle cx="20" cy="17" r="4.5" fill="#FF5F56"/>
    <circle cx="34" cy="17" r="4.5" fill="#FFBD2E"/>
    <circle cx="48" cy="17" r="4.5" fill="#27C93F"/>
    <rect x="70" y="7" width="260" height="20" rx="4" fill="#0D0E15"/>
    <text x="80" y="21" font-family="monospace" font-size="9" fill="#8E92BC">Canvas Live Preview (100% Client-Side)</text>

    <!-- Canvas Inner Web Content -->
    <text x="30" y="75" font-family="-apple-system, sans-serif" font-size="20" font-weight="black" fill="#FFFFFF">Hello, I'm a Product Builder</text>
    <text x="30" y="98" font-family="-apple-system, sans-serif" font-size="11" fill="#72F3C0">⚡ Vibe Coding with Gemini Canvas</text>

    <!-- Interactive Card 1 inside preview -->
    <g transform="translate(30, 120)">
      <rect width="185" height="130" rx="8" fill="#181924" stroke="#476BFF" stroke-width="1.5"/>
      <text x="15" y="30" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">AI 서비스 기획 프로젝트</text>
      <text x="15" y="52" font-family="-apple-system, sans-serif" font-size="9" fill="#8E92BC">• 문제 정의 및 페르소나 설계</text>
      <text x="15" y="70" font-family="-apple-system, sans-serif" font-size="9" fill="#8E92BC">• 사용자 여정 맵핑</text>
      <rect x="15" y="95" width="60" height="18" rx="4" fill="#476BFF"/>
      <text x="25" y="108" font-family="-apple-system, sans-serif" font-size="8" fill="#FFFFFF" font-weight="bold">Live View</text>
    </g>

    <!-- Interactive Card 2 inside preview -->
    <g transform="translate(235, 120)">
      <rect width="190" height="130" rx="8" fill="#181924" stroke="#2B2C3E" stroke-width="1.5"/>
      <text x="15" y="30" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">데이터 분석 & 자동화</text>
      <text x="15" y="52" font-family="-apple-system, sans-serif" font-size="9" fill="#8E92BC">• 전환율 32% 상승 달성</text>
      <text x="15" y="70" font-family="-apple-system, sans-serif" font-size="9" fill="#8E92BC">• SQL & Python 대시보드</text>
      <rect x="15" y="95" width="60" height="18" rx="4" fill="#2B3048"/>
      <text x="25" y="108" font-family="-apple-system, sans-serif" font-size="8" fill="#8CA4FF" font-weight="bold">Explore</text>
    </g>
  </g>
</svg>
