    :root {
      color-scheme: dark;
      --bg: #0b0d12;
      --panel: rgba(25, 29, 39, .88);
      --panel-2: rgba(16, 19, 28, .92);
      --line: rgba(255,255,255,.13);
      --muted: #9da6b8;
      --text: #f5f7fb;
      --cyan: #55d6ff;
      --violet: #c6a5ff;
      --lime: #c4ef75;
      --orange: #ffbf69;
      --red: #ff8c9a;
      --shadow: 0 18px 60px rgba(0,0,0,.28);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 0%, rgba(58, 173, 201, .16), transparent 34rem),
        radial-gradient(circle at 92% 8%, rgba(176, 93, 184, .15), transparent 30rem),
        var(--bg);
    }
    a { color: var(--cyan); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header { padding: 34px 4vw 22px; border-bottom: 1px solid var(--line); }
    .eyebrow { color: var(--cyan); font: 700 12px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 10px 0 7px; font-size: clamp(28px, 4vw, 52px); letter-spacing: -.04em; }
    .subtitle { max-width: 980px; color: var(--muted); line-height: 1.6; margin: 0; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin-top: 22px; }
    .toolbar label { color: var(--muted); font-size: 12px; }
    select, button { border: 1px solid var(--line); border-radius: 999px; color: var(--text); background: rgba(255,255,255,.06); padding: 9px 13px; font: inherit; }
    button { cursor: pointer; }
    button:hover, button.is-selected { border-color: rgba(85,214,255,.65); background: rgba(85,214,255,.14); }
    #export { margin-left: auto; border-color: rgba(196,239,117,.42); color: var(--lime); }
    .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 17px; }
    .stat { border: 1px solid var(--line); border-radius: 12px; padding: 8px 11px; background: rgba(255,255,255,.035); color: var(--muted); font-size: 12px; }
    .stat strong { color: var(--text); font-size: 16px; margin-right: 5px; }
    main { display: grid; gap: 22px; padding: 26px 4vw 60px; }
    .slide-card { border: 1px solid var(--line); border-radius: 22px; overflow: hidden; background: linear-gradient(135deg, rgba(255,255,255,.065), rgba(255,255,255,.02)); box-shadow: var(--shadow); }
    .slide-head { display: grid; grid-template-columns: minmax(210px, .72fr) 1.28fr; gap: 22px; padding: 20px; border-bottom: 1px solid var(--line); }
    .slide-preview { min-height: 150px; display: grid; place-items: center; position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 15px; background: linear-gradient(145deg, #17212a, #18121d 70%, #101216); }
    .slide-preview img { width: 100%; height: 100%; min-height: 150px; object-fit: cover; }
    .slide-preview .wire { padding: 22px; width: 100%; color: rgba(255,255,255,.72); }
    .wire .wire-kicker { width: 28%; height: 7px; border-radius: 6px; background: var(--cyan); opacity: .75; margin-bottom: 15px; }
    .wire .wire-title { width: 76%; height: 18px; border-radius: 6px; background: rgba(255,255,255,.75); margin-bottom: 18px; }
    .wire .wire-body { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .wire .wire-body i { height: 44px; border: 1px solid rgba(255,255,255,.2); border-radius: 8px; background: rgba(255,255,255,.07); }
    .slide-meta { display: flex; flex-direction: column; justify-content: center; }
    .slide-id { color: var(--orange); font: 700 12px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .08em; }
    .slide-meta h2 { margin: 8px 0 7px; font-size: clamp(21px, 2.2vw, 30px); letter-spacing: -.03em; }
    .slide-meta p { color: var(--muted); line-height: 1.55; margin: 0 0 9px; }
    .slide-meta .claim { color: #dbe3ef; }
    .options { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; padding: 18px 20px 20px; }
    .option { display: flex; flex-direction: column; min-width: 0; border: 1px solid var(--line); border-radius: 16px; padding: 15px; background: var(--panel-2); transition: border-color .2s, transform .2s, background .2s; }
    .option:hover { transform: translateY(-2px); border-color: rgba(198,165,255,.52); }
    .option.is-approved { border-color: rgba(196,239,117,.7); background: linear-gradient(145deg, rgba(196,239,117,.11), rgba(16,19,28,.96)); }
    .option.is-skipped { opacity: .55; }
    .option-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .option-label { color: var(--violet); font: 700 11px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .1em; text-transform: uppercase; }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .priority, .status { display: inline-flex; align-items: center; min-height: 22px; padding: 3px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .priority { color: var(--orange); border-color: rgba(255,191,105,.35); }
    .recommendation { color: var(--violet); border-color: rgba(198,165,255,.35); }
    .status { color: var(--cyan); border-color: rgba(85,214,255,.35); }
    .option h3 { margin: 12px 0 7px; font-size: 18px; line-height: 1.28; }
    .option p { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 5px 0; }
    .option p strong { color: #e8eef7; }
    .asset-preview { min-height: 118px; display: grid; place-items: center; overflow: hidden; margin: 12px 0; border: 1px solid rgba(255,255,255,.1); border-radius: 12px; background: linear-gradient(135deg, rgba(85,214,255,.08), rgba(198,165,255,.09)); }
    .asset-preview img { width: 100%; height: 118px; object-fit: cover; }
    .asset-placeholder { width: 100%; padding: 17px; text-align: center; color: #dce5f3; }
    .asset-placeholder .media-icon { display: block; margin-bottom: 7px; color: var(--cyan); font-size: 25px; }
    .facts { display: grid; gap: 7px; margin: 10px 0 13px; }
    .fact { padding-top: 7px; border-top: 1px solid rgba(255,255,255,.08); font-size: 12px; line-height: 1.45; }
    .fact b { display: block; color: #dfe6f2; margin-bottom: 2px; }
    .icon-row { display: flex; flex-wrap: wrap; gap: 7px; margin: 7px 0; }
    .icon-token { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; color: #dce5f3; font-size: 11px; }
    .icon-token img { width: 18px; height: 18px; object-fit: contain; }
    .links { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; font-size: 12px; }
    .links a { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 12px; }
    .actions button { padding: 7px 9px; font-size: 11px; }
    .actions button[data-action="approve"] { color: var(--lime); }
    .actions button[data-action="skip"] { color: var(--red); }
    .empty { padding: 42px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 16px; }
    footer { padding: 0 4vw 32px; color: var(--muted); font-size: 12px; }
    @media (max-width: 760px) {
      .slide-head { grid-template-columns: 1fr; }
      #export { margin-left: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>

  </script>
  <script>
    const reviewData = JSON.parse(document.getElementById('review-data').textContent)
    const stateKey = `slidev-asset-review:${location.pathname}:${reviewData.meta?.skillRevision || 'legacy'}`
    const saved = JSON.parse(localStorage.getItem(stateKey) || '{}')
    // `option.decision` is deliberately ignored. Generated proposals are
    // undecided; only this explicit decision map or a browser click is a user
    // decision. This also makes an accidentally pre-approved old board appear
    // undecided instead of silently treating model preference as consent.
    const decisions = { ...(reviewData.decisions || {}), ...saved }

    const decisionFor = (option) => {
      const value = decisions[option.id]
      if (typeof value === 'string' && value) return value
      if (value && typeof value === 'object' && value.decision) return value.decision
      return 'undecided'
    }
    const recommendationFor = (option) => {
      const value = String(option.recommendation || '').toLowerCase()
      if (['preferred', 'alternative', 'fallback'].includes(value)) return value
      const label = String(option.label || '').toLowerCase()
      if (label.includes('alternative')) return 'alternative'
      if (label.includes('fallback')) return 'fallback'
      return 'missing'
    }

    const escapeHtml = (value = '') => String(value).replace(/[&<>'"]/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;',
    })[char])
    const safeUrl = (value = '') => /^(https?:\/\/|\.\.?\/|\/)/i.test(value) ? value : '#'
    const text = (value = '') => escapeHtml(value || '—')
    const link = (item) => `<a href="${escapeHtml(safeUrl(item.url))}" target="_blank" rel="noopener noreferrer">${text(item.label || item.url)}</a>`

    const mediaGlyph = (kind = '') => {
      const key = kind.toLowerCase()
      if (key.includes('video') || key.includes('youtube') || key.includes('gif')) return '▶'
      if (key.includes('social') || key.includes('quote')) return '❝'
      if (key.includes('diagram') || key.includes('svg') || key.includes('flow')) return '◇'
      if (key.includes('screenshot') || key.includes('screen')) return '▣'
      if (key.includes('chart') || key.includes('data')) return '▥'
      if (key.includes('logo') || key.includes('icon')) return '✦'
      return '＋'
    }

    const iconRow = (assets = []) => assets.length
      ? `<div class="icon-row">${assets.map(asset => `<span class="icon-token">${asset.path ? `<img src="${escapeHtml(asset.path)}" alt="">` : ''}${text(asset.label)}</span>`).join('')}</div>`
      : ''

    const optionMatches = (option, priority, decision) => {
      const chosen = decisionFor(option)
      return (priority === 'all' || option.priority === priority) && (decision === 'all' || chosen === decision)
    }

    const optionCard = (slide, option) => {
      const decision = decisionFor(option)
      const recommendation = recommendationFor(option)
      const classes = ['option', decision === 'approve' ? 'is-approved' : '', decision === 'skip' ? 'is-skipped' : ''].filter(Boolean).join(' ')
      const preview = option.previewImage
        ? `<img src="${escapeHtml(option.previewImage)}" alt="${escapeHtml(option.title || option.kind || 'asset candidate')}">`
        : `<div class="asset-placeholder"><span class="media-icon">${mediaGlyph(option.mediaType || option.kind)}</span>${text(option.previewLabel || option.mediaType || option.kind || 'static candidate')}</div>`
      const hasSearchBrief = option.searchBrief && (option.searchBrief.ko || option.searchBrief.en)
      const search = hasSearchBrief ? `<div class="fact"><b>Search / capture brief</b>${text(option.searchBrief.ko)}${option.searchBrief.en ? `<br><span>${text(option.searchBrief.en)}</span>` : ''}</div>` : ''
      const links = option.candidateLinks?.length ? `<div class="links">${option.candidateLinks.map(link).join('')}</div>` : ''
      const actions = ['approve', 'find', 'capture', 'create', 'skip', 'defer'].map(action => `<button type="button" data-option="${escapeHtml(option.id)}" data-action="${action}" class="${decision === action ? 'is-selected' : ''}">${action}</button>`).join('')
      return `<article class="${classes}" data-option-id="${escapeHtml(option.id)}" data-priority="${escapeHtml(option.priority || '')}" data-decision="${escapeHtml(decision)}">
        <div class="option-top"><span class="option-label">${text(option.id || 'Option')}</span><span class="chips"><span class="recommendation">${text(recommendation)}</span><span class="priority">${text(option.priority || 'P1')}</span><span class="status">${text(decision)}</span></span></div>
        <h3>${text(option.title || option.kind || 'Asset candidate')}</h3>
        <div class="asset-preview">${preview}</div>
        <p><strong>Visual job:</strong> ${text(option.visualJob)}</p>
        <p><strong>Why:</strong> ${text(option.why)}</p>
        ${iconRow(option.existingAssets)}
        <div class="facts">
          <div class="fact"><b>Media type</b>${text(option.mediaType || option.kind)}</div>
          <div class="fact"><b>Static placement</b>${text(option.staticPlacement)}</div>
          <div class="fact"><b>Minimum spec / target</b>${text(option.spec)}${option.targetPath ? `<br><code>${text(option.targetPath)}</code>` : ''}</div>
          ${search}
          <div class="fact"><b>Rights / fallback</b>${text(option.rights)}<br><span>${text(option.fallback)}</span></div>
        </div>
        ${links}
        <div class="actions">${actions}</div>
      </article>`
    }

    const render = () => {
      const priority = document.getElementById('priority-filter').value
      const decision = document.getElementById('decision-filter').value
      const board = document.getElementById('board')
      const visibleSlides = []
      for (const slide of reviewData.slides || []) {
        const options = (slide.options || []).filter(option => optionMatches(option, priority, decision))
        if (!options.length) continue
        visibleSlides.push(`<section class="slide-card">
          <div class="slide-head">
            <div class="slide-preview">${slide.previewImage ? `<img src="${escapeHtml(slide.previewImage)}" alt="${escapeHtml(slide.title || slide.id)}">` : `<div class="wire"><div class="wire-kicker"></div><div class="wire-title"></div><div class="wire-body"><i></i><i></i><i></i></div></div>`}</div>
            <div class="slide-meta"><div class="slide-id">${text(slide.id)}</div><h2>${text(slide.title)}</h2><p class="claim">${text(slide.claim)}</p><p><strong>Current role:</strong> ${text(slide.role)}<br><strong>Static question:</strong> ${text(slide.question)}</p></div>
          </div>
          <div class="options">${options.map(option => optionCard(slide, option)).join('')}</div>
        </section>`)
      }
      board.innerHTML = visibleSlides.join('') || '<div class="empty">현재 필터와 일치하는 후보가 없습니다.</div>'
      document.querySelectorAll('[data-action]').forEach(button => button.addEventListener('click', () => {
        decisions[button.dataset.option] = button.dataset.action
        localStorage.setItem(stateKey, JSON.stringify(decisions))
        render()
        renderStats()
      }))
    }

    const renderStats = () => {
      const options = (reviewData.slides || []).flatMap(slide => slide.options || [])
      const count = value => options.filter(option => decisionFor(option) === value).length
      const priorityCount = value => options.filter(option => option.priority === value).length
      document.getElementById('stats').innerHTML = [
        ['slides', (reviewData.slides || []).length],
        ['ideas', options.length],
        ['P0', priorityCount('P0')],
        ['P1', priorityCount('P1')],
        ['P2', priorityCount('P2')],
        ['decided', options.length - count('undecided')],
      ].map(([label, value]) => `<span class="stat"><strong>${value}</strong>${label}</span>`).join('')
    }

    document.getElementById('page-title').textContent = reviewData.meta?.title || 'Asset review'
    document.getElementById('page-subtitle').textContent = [
      reviewData.meta?.draft ? `Draft: ${reviewData.meta.draft}` : '',
      reviewData.meta?.previewState ? `Preview: ${reviewData.meta.previewState}` : '',
      reviewData.meta?.note || '승인된 슬라이드 흐름은 유지하고, 정적 에셋 선택지만 검토합니다.',
    ].filter(Boolean).join(' · ')
    document.getElementById('priority-filter').addEventListener('change', render)
    document.getElementById('decision-filter').addEventListener('change', render)
    document.getElementById('export').addEventListener('click', () => {
      const payload = {
        kind: 'slidev-asset-review-decisions',
        generatedAt: new Date().toISOString(),
        draft: reviewData.meta?.draft || '',
        schemaVersion: reviewData.meta?.schemaVersion || 3,
        skillRevision: reviewData.meta?.skillRevision || '',
        decisions,
      }
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' })
      const url = URL.createObjectURL(blob)
      const anchor = document.createElement('a')
      anchor.href = url
      anchor.download = 'asset-review-decisions.json'
      anchor.click()
      URL.revokeObjectURL(url)
    })
    renderStats()
    render()
  </script>
